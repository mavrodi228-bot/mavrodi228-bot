services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cashlens
      POSTGRES_USER: cashlens
      POSTGRES_PASSWORD: cashlens
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    ports:
      - '8000:8000'
    depends_on:
      - db
    command: sh -c "alembic upgrade head && python -m app.db.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - '5173:5173'
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
